[project]
name = "veeam-ports-mcp"
version = "1.0.1"
description = "MCP server for querying Veeam product network port requirements"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.26.0,<2.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://magicports.veeambp.com"
Repository = "https://github.com/shapedthought/veeam-ports-mcp"
Issues = "https://github.com/shapedthought/veeam-ports-mcp/issues"

[project.scripts]
veeam-ports-mcp = "veeam_ports_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veeam_ports_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
]
