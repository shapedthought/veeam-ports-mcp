[project]
name = "veeam-ports-mcp"
version = "0.1.0"
description = "MCP server for querying Veeam product network port requirements"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.26.0",
]

[project.scripts]
veeam-ports-mcp = "veeam_ports_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veeam_ports_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
